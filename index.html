<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11120f" />
    <title>SPECTRA — AI 사용 현황</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      프로토타입 전용 — 제품화 전 UI 방향을 비교하는 임시 코드입니다.
      질문: "여러 AI 서비스의 사용량을 데스크톱과 iOS에서 가장 빠르게 읽는 구조는 무엇인가?"
      구조가 다른 세 시안을 한 화면에서 ?variant=A|B|C로 전환합니다.
    -->
    <div class="ambient" aria-hidden="true">
      <i class="orb orb-violet"></i><i class="orb orb-cyan"></i><i class="orb orb-pink"></i>
      <span class="grain"></span>
    </div>
    <main id="app" aria-live="polite"></main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
