[package]
name = "spectra-native"
version = "0.2.0"
description = "Native account and personal-plan quota bridge for SPECTRA"
authors = ["SPECTRA"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "spectra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "spectra-native"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
png = "0.17"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "2.4.9"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "4.1.6", default-features = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
